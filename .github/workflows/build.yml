name: Build Necromancy mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle -p NecromancyForge build
      - uses: actions/upload-artifact@v4
        with:
          name: Necromancy-Forge-1.20.1
          path: NecromancyForge/build/libs/*.jar
          if-no-files-found: error
